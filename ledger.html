<title>隨手記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen phone ledger — entry pad is home; tabs at the bottom; everything else scrolls inside main. */
:root {
  --bg: #EEF2F0; --surface: #FFFFFF; --sunk: #E3E9E6; --line: #D3DCD8;
  --fg: #16201D; --muted: #5C6A65;
  --accent: #0F5C55; --accent-fg: #FFFFFF; --accent-soft: #D5E8E4;
  --exp: #C23F36; --inc: #1F7F52; --xfer: #46618F; --warn: #A86A00;
  --hero-a: #0F5C55; --hero-b: #1F8070; --hero-fg: #FFFFFF;
  --ring-in: #3E7CC4; --ring-out: #EE8A3C;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
:root[lang="zh-CN"] { --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
:root[lang="en"] { --font-ui: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1312; --surface: #171F1D; --sunk: #1F2926; --line: #2B3734;
  --fg: #E4ECE9; --muted: #92A29C;
  --accent: #4DB5A6; --accent-fg: #03201C; --accent-soft: #1C3A36;
  --exp: #F07A70; --inc: #5BC98E; --xfer: #8FA7D8; --warn: #E3A840;
  --hero-a: #22665C; --hero-b: #143F3A; --hero-fg: #EAF4F1;
  --ring-in: #6FA3E0; --ring-out: #F5A05E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #171F1D; --sunk: #1F2926; --line: #2B3734;
  --fg: #E4ECE9; --muted: #92A29C;
  --accent: #4DB5A6; --accent-fg: #03201C; --accent-soft: #1C3A36;
  --exp: #F07A70; --inc: #5BC98E; --xfer: #8FA7D8; --warn: #E3A840;
  --hero-a: #22665C; --hero-b: #143F3A; --hero-fg: #EAF4F1;
  --ring-in: #6FA3E0; --ring-out: #F5A05E; color-scheme: dark }

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.exp { color: var(--exp); } .inc { color: var(--inc); } .xfer { color: var(--xfer); }
.muted { color: var(--muted); }

#app { height: 100%; max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 6px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .02em; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 4px 0; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="ok"] i { background: var(--inc); }
.sync[data-s="busy"] i { background: var(--warn); }
.sync[data-s="err"] i { background: var(--exp); }
.sync[data-s="err"] { color: var(--exp); }
main { flex: 1; min-height: 0; overflow: auto; padding-inline: 16px; padding-block: 4px 16px; }
nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
nav.tabs button { background: none; border: 0; padding: 9px 0 10px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* segmented */
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg button[aria-pressed="true"][data-t="expense"] { color: var(--exp); }
.seg button[aria-pressed="true"][data-t="income"] { color: var(--inc); }
.seg button[aria-pressed="true"][data-t="transfer"] { color: var(--xfer); }

/* entry */
.entry { height: 100%; display: flex; flex-direction: column; gap: 7px; }
.entry-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.today { font-size: 12px; color: var(--muted); }
.editbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--r); padding: 6px 10px; font-size: 13px; }
.editbar .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.budstrip { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.budstrip .bud-top { display: flex; justify-content: space-between; gap: 8px; }
.track { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.track i.warn { background: var(--warn); }
.track i.over { background: var(--exp); }
.amount { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 14px; text-align: right; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
.amount .expr { font-size: 12px; color: var(--muted); min-height: 16px; }
.amount .val { font-size: 32px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.amount .val small { font-size: 14px; margin-right: 6px; color: var(--muted); font-weight: 500; }
.amount.shake { animation: shake .3s; border-color: var(--exp); }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.extra { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.extra input { width: 110px; min-height: 34px; padding: 4px 8px; }
.cats { flex: 1; min-height: 72px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; align-content: start; }
.cat { border: 1px solid transparent; background: none; border-radius: var(--r); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; text-align: center; line-height: 1.2; }
.badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font-size: 15px; font-weight: 700; flex: none; }
.cat[aria-pressed="true"] { border-color: var(--c); background: var(--surface); color: var(--fg); font-weight: 700; }
.xfer-box { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; align-content: center; }
.xfer-box label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.arrow { font-size: 20px; color: var(--xfer); padding-top: 18px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fields .note { min-width: 0; }
.fields .wide { grid-column: 1 / -1; }
.field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-height: 40px; }
.datebox { display: flex; gap: 4px; }
.datebox input { flex: 1; min-width: 0; }
.tagchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pad button { border: 0; border-radius: var(--r); background: var(--surface); height: clamp(40px, 6.2vh, 56px); font-family: var(--font-num); font-size: 20px; font-weight: 500; box-shadow: 0 1px 0 var(--line); }
.pad button:active { background: var(--sunk); }
.pad .op { background: var(--sunk); font-size: 18px; }
.pad .save { background: var(--accent); color: var(--accent-fg); font-family: var(--font-ui); font-size: 17px; font-weight: 700; }
.pad .save:disabled { opacity: .5; cursor: wait; }

/* generic */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--exp); border-color: var(--exp); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .45; }
h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin: 18px 0 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 10px; }
.monthbar strong { font-size: 17px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; line-height: 1; flex: none; }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 4px; }
.totals div { display: grid; text-align: center; gap: 2px; min-width: 0; }
.totals span { font-size: 12px; color: var(--muted); }
.totals b { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.search { margin: 10px 0 4px; }
.day { margin-top: 14px; }
.day-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 4px 4px; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.rows li:first-child .row { border-top: 0; }
.row .mid { flex: 1; min-width: 0; display: grid; }
.row .mid b { font-weight: 500; }
.row .mid small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mid small em { font-style: normal; color: var(--accent); }
.row .amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; display: grid; }
.row .amt small { font-size: 11px; color: var(--muted); font-weight: 500; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; font-size: 14px; }
.legend { list-style: none; padding: 0; margin: 0; }
.legend li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.legend li:first-child { border-top: 0; }
.legend .bar { height: 4px; border-radius: 2px; background: var(--c); }
.legend .mid { flex: 1; min-width: 0; display: grid; gap: 4px; }
.legend .mid div { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.chart { padding: 12px; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart-key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 12px 10px; }
.chart-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.budlist { display: grid; }
.bud { display: grid; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--line); }
.bud:first-child { border-top: 0; }
.bud .bud-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bud small { font-size: 12px; color: var(--muted); }
.taglist button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 12px; text-align: left; }
.taglist button:first-child { border-top: 0; }
.taglist b { color: var(--accent); font-weight: 600; }
.networth { padding: 16px; display: grid; gap: 2px; }
.networth span { font-size: 12px; color: var(--muted); }
.networth b { font-family: var(--font-num); font-size: 28px; font-weight: 600; }
.acct { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.acct:first-child { border-top: 0; }
.acct-line { display: flex; align-items: center; gap: 10px; }
.acct-line .mid { flex: 1; min-width: 0; display: grid; }
.acct-line small { font-size: 12px; color: var(--muted); }
.acct-line .bal { font-family: var(--font-num); font-weight: 600; text-align: right; display: grid; }
.acct-line .bal small { font-weight: 500; }
.editor { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.editor .full { grid-column: 1 / -1; }
.editor label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.editor .actions { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.catrow { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.catrow:first-child { border-top: 0; }
.catrow input.field { flex: 1; min-width: 0; min-height: 34px; padding: 4px 8px; }
.catrow input.budin { flex: 0 0 96px; }
.catrow .badge { width: 28px; height: 28px; font-size: 13px; border: 0; cursor: pointer; }
.catrow .mid { flex: 1; min-width: 0; display: grid; }
.catrow .mid small { font-size: 12px; color: var(--muted); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 12px 14px 16px; text-align: left; }
.menu button:first-child { border-top: 0; }
.menu .mid { flex: 1; min-width: 0; display: grid; gap: 1px; }
.menu .mid b { font-weight: 500; font-size: 15px; }
.menu .mid small { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu .mid small.exp { color: var(--exp); }
.menu .chev { color: var(--muted); font-size: 22px; line-height: 1; }
.subhead { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
.subhead strong { font-size: 17px; }
.langs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px; }
.langs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-size: 14px; }
.langs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.addrow { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.addrow input { flex: 1; min-width: 120px; }
.addrow select { width: auto; max-width: 100%; }
.section-body { padding: 12px; display: grid; gap: 10px; }
.section-body p { margin: 0; font-size: 14px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
textarea.field { min-height: 120px; font-family: var(--font-num); font-size: 12px; }
.notice { font-size: 13px; border-radius: var(--r); padding: 8px 12px; background: var(--accent-soft); }
.notice.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.hint { font-size: 12px; color: var(--muted); margin: 8px 4px 0; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 10px 9px 16px; border-radius: 18px; font-size: 14px; display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgb(0 0 0 / .25); z-index: 10; }
.toast .warnline { display: block; color: var(--warn); font-weight: 700; }
.toast button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 2px 10px; font-size: 13px; flex: none; }
/* richer surfaces: soft type tints, icon badges, gradient hero */
.brand { display: inline-flex; align-items: center; gap: 8px; }
.logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); display: grid; place-items: center; color: var(--hero-fg); }
.logo svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ico.dots { stroke-width: 3.2; }
.card { box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
nav.tabs button svg { box-sizing: content-box; padding: 3px 14px; border-radius: 999px; transition: background .15s; }
nav.tabs button[aria-current="page"] svg { background: var(--accent-soft); }
.amount { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; --tc: var(--exp); background: color-mix(in srgb, var(--tc) 7%, var(--surface)); border-color: color-mix(in srgb, var(--tc) 30%, var(--line)); transition: background .2s, border-color .2s; }
.amount[data-t="income"] { --tc: var(--inc); }
.amount[data-t="transfer"] { --tc: var(--xfer); }
.amt-cat { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--fg); text-align: left; }
.amt-cat > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt-cat .badge { width: 32px; height: 32px; }
.amt-num { display: flex; flex-direction: column; min-width: 0; text-align: right; }
.cat .badge { background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); transition: background .15s, color .15s; }
.cat[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 10%, var(--surface)); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.cat[aria-pressed="true"] .badge { background: var(--c); color: #fff; }
.pad .save { background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: var(--hero-fg); }
.totals { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0; }
.totals .tile { --tc: var(--accent); background: color-mix(in srgb, var(--tc) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tc) 22%, var(--line)); border-radius: var(--r); padding: 10px 6px; justify-items: center; }
.totals .tile.inc { --tc: var(--inc); }
.totals .tile.exp { --tc: var(--exp); }
.totals .tile span { display: inline-flex; align-items: center; gap: 5px; }
.totals .tile span i { width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.totals .tile b { color: var(--tc); }
.totals .tile.net b { color: var(--fg); }
.networth { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); border: 0; padding: 18px 16px 20px; }
.networth::after { content: ""; position: absolute; right: -46px; top: -56px; width: 180px; height: 180px; border-radius: 50%; border: 28px solid rgb(255 255 255 / .08); pointer-events: none; }
.networth::before { content: ""; position: absolute; right: 60px; bottom: -70px; width: 120px; height: 120px; border-radius: 50%; background: rgb(255 255 255 / .06); pointer-events: none; }
.networth span, .networth b { position: relative; color: var(--hero-fg); }
.networth span { opacity: .82; }
.networth b.exp { color: var(--hero-fg); }
.menu .mi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); }
.subhead .mi { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); }
.row, .menu button, .taglist button { transition: background .12s; }
.row:hover, .menu button:hover, .taglist button:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.day-head span:first-child { font-weight: 700; color: var(--fg); }
.empty .ico { width: 40px; height: 40px; color: var(--line); display: block; margin: 0 auto 8px; }
.sumring { display: flex; align-items: center; justify-content: center; padding-block: 10px 6px; }
.ringbox { position: relative; width: 190px; max-width: 70%; flex: none; }
.legend li { padding: 0; }
.lg-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; background: none; border: 0; text-align: left; transition: background .12s; }
.lg-btn:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.lg-btn .chev { color: var(--muted); font-size: 18px; line-height: 1; }
/* category detail sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { position: absolute; inset: 0; background: rgb(0 0 0 / .42); animation: fadein .18s ease-out; }
.sheet-panel { position: relative; width: 100%; max-width: 540px; max-height: 86%; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgb(0 0 0 / .2); animation: sheetup .22s ease-out; }

.sh-head { display: flex; align-items: center; gap: 12px; }
.sh-head .badge { width: 48px; height: 48px; font-size: 20px; }
.sh-head .mid { flex: 1; min-width: 0; display: grid; }
.sh-head h3 { margin: 0; font-size: 18px; }
.sh-head small { color: var(--muted); font-size: 13px; }
.sh-total { font-family: var(--font-num); font-size: 30px; font-weight: 600; margin: 12px 0 2px; }
.sh-diff { font-size: 13px; color: var(--muted); }
.sh-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.sh-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.sh-stats span { font-size: 12px; color: var(--muted); }
.sh-stats b { font-family: var(--font-num); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
@keyframes sheetup { from { transform: translateY(40px); opacity: 0; } }
@keyframes fadein { from { opacity: 0; } }
.rangebar { display: grid; gap: 8px; justify-items: center; margin-bottom: 4px; }
.rangeseg button { padding: 5px 12px; }
.rangedates { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 360px; }
.rangedates input { flex: 1; min-width: 0; min-height: 36px; padding: 4px 8px; }
.rangedates span { color: var(--muted); }
.piebox { display: flex; justify-content: center; padding-block: 6px 4px; }
.piebox svg { display: block; width: 210px; max-width: 70%; height: auto; }
.topright { display: inline-flex; align-items: center; gap: 6px; }
.themebtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; padding: 0; }
.themebtn .ico { width: 17px; height: 17px; }
.themebtn:hover { border-color: var(--accent); color: var(--accent); }
.rc-link { display: inline-flex; align-items: center; justify-content: center; gap: 5px; background: none; border: 0; padding: 2px 8px; border-radius: 999px; font-size: 15px; color: var(--muted); }
.rc-link .ico { width: 18px; height: 18px; }
.rc-link:hover { color: var(--accent); background: var(--accent-soft); }
.ringbox svg { display: block; width: 100%; height: auto; }
.ringbox .rc { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 1px; }
.ringbox .rc span { font-size: 12px; color: var(--muted); }
.ringbox .rc b { font-weight: 600; }
.ringlegend { list-style: none; margin: 0; padding: 0; flex: 0 1 auto; min-width: 0; display: grid; gap: 10px; }
.ringlegend li { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 8px; font-size: 13px; color: var(--muted); }
.ringlegend li i { width: 9px; height: 9px; border-radius: 50%; grid-row: span 2; align-self: start; margin-top: 5px; }
.ringlegend li b { grid-column: 2; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.ringlegend li.note { display: block; font-size: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
.ringlegend li.note.exp { color: var(--exp); font-weight: 600; }
/* category grid: 4 per row on phones, 5 on wider screens, larger icons */
.cats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; }
@media (min-width: 440px) { .cats { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.cat { padding: 8px 2px 6px; gap: 5px; font-size: 13px; }
.cat .badge { width: 46px; height: 46px; font-size: 18px; }
.cat .badge .ico { width: 52%; height: 52%; }

.cat.add:hover .badge { border-color: var(--accent); color: var(--accent); }

}

    return `<div class="xfer-box" id="dyn-cats">
      <label>${t('轉出帳戶')}<select class="field" id="f-from">${acctOptions(form.acct)}</select></label>
      <span class="arrow" aria-hidden="true">→</span>
      <label>${t('轉入帳戶')}<select class="field" id="f-to">${acctOptions(form.to, form.acct)}</select></label>
    </div>`;
  }
  return `<div class="cats" id="dyn-cats" role="group" aria-label="${t('分類')}">${meta.cats[form.type].map(c =>
    `<button type="button" class="cat" data-cat="${esc(c.id)}" style="--c:${catColor(c)}" aria-pressed="${c.id === form.cat}"><span class="badge">${glyph(c.id, nameOf(c))}</span>${esc(nameOf(c))}</button>`).join('')}<button type="button" class="cat add" data-act="edit-cats"><span class="badge">${icon('plus')}</span>${t('編輯分類')}</button></div>`;
}
function extraRow() {
  const cur = acctCur(form.acct); const parts = [];
  if (cur !== meta.baseCur) parts.push(`<label for="f-rate">${t('匯率 1 {c} =', { c: esc(cur) })}</label><input class="field num" id="f-rate" type="number" inputmode="decimal" step="any" min="0" value="${esc(form.rate || meta.rates[cur] || '')}" placeholder="${t('手動輸入')}"><span>${esc(meta.baseCur)}</span><span id="base-eq" class="num"></span>`);
  if (form.type === 'transfer' && form.to && acctCur(form.to) !== cur) parts.push(`<label for="f-toamt">${t('轉入金額 ({c})', { c: esc(acctCur(form.to)) })}</label><input class="field num" id="f-toamt" type="number" inputmode="decimal" step="any" min="0" value="${esc(form.toAmt)}">`);
  return `<div class="extra" id="dyn-extra"${parts.length ? '' : ' hidden'}>${parts.join('')}</div>`;
}
function streak() {
  const days = new Set(allTx().map(x => x.date)); let d = today(); if (!days.has(d)) d = addDays(d, -1);
  let n = 0; while (days.has(d) && n < 3650) { n++; d = addDays(d, -1); } return n;
}
function todayLine() {
  const td = today(); const list = monthTx(td.slice(0, 7)).filter(x => x.date === td);
  const s = streak();
  return t('今天 {n} 筆 · 支出 {v}', { n: list.length, v: `<span class="num">${fmt(sums(list).exp)}</span>` }) + (s >= 2 ? '　' + t('連續記帳 {n} 天', { n: s }) : '');
}
function budgetStrip() {
  const ym = today().slice(0, 7); const s = monthBudgetState(ym, form.type === 'expense' ? form.cat : null);
  const useCat = form.type === 'expense' && s.catLimit;
  const spent = useCat ? s.catSpent : s.total, lim = useCat ? s.catLimit : s.totalLimit;
  if (!lim) return `<div class="budstrip" id="dyn-bud"><div class="bud-top"><span>${t('本月支出')}</span><span class="num">${fmt(s.total)}</span></div></div>`;
  const p = spent / lim; const label = useCat ? t('{c}預算', { c: catName('expense', form.cat) }) : t('本月預算');
  return `<div class="budstrip" id="dyn-bud"><div class="bud-top"><span>${esc(label)}</span><span class="num ${p > 1 ? 'exp' : ''}">${p > 1 ? t('超支 {v}', { v: fmt(spent - lim) }) : t('剩 {v}', { v: fmt(lim - spent) })} / ${fmt(lim)}</span></div><div class="track"><i class="${p > 1 ? 'over' : p >= .8 ? 'warn' : ''}" style="width:${Math.min(p, 1) * 100}%"></i></div></div>`;
}
function tagChips() {
  const tags = allTags().sort((a, b) => b.lastTs - a.lastTs).slice(0, 10);
  if (!tags.length) return `<div class="tagchips" id="dyn-tags" hidden></div>`;
  const cur = parseTags(form.note);
  return `<div class="tagchips" id="dyn-tags" role="group" aria-label="${t('常用標籤')}">${tags.map(g => `<button type="button" class="chip" data-tag="${esc(g.tag)}" aria-pressed="${cur.includes(g.tag)}">#${esc(g.tag)}</button>`).join('')}</div>`;
}
function viewAdd() {
  const edit = form.editId ? `<div class="editbar"><span>${t('正在編輯一筆記錄')}</span><span class="btns">
      <button type="button" class="btn sm" data-act="make-rec">${t('設為每月固定')}</button>
      <button type="button" class="btn sm danger" data-act="del">${t(form.delArm ? '確定刪除' : '刪除')}</button>
      <button type="button" class="btn sm" data-act="cancel-edit">${t('取消')}</button></span></div>` : '';
  const acctSel = form.type === 'transfer' ? '' : `<select class="field" id="f-acct" aria-label="${t('帳戶')}">${acctOptions(form.acct)}</select>`;
  return `<section class="entry">
    <div class="entry-head">
      <div class="seg" role="group" aria-label="${t('類型')}">${['expense', 'income', 'transfer'].map(k => `<button type="button" data-t="${k}" aria-pressed="${form.type === k}">${typeName(k)}</button>`).join('')}</div>
      <span class="today" id="dyn-today">${todayLine()}</span>
    </div>
    ${edit}
    ${budgetStrip()}
    ${catGrid()}
    <div class="amount" id="amount" data-t="${form.type}"><div class="amt-cat" id="amt-cat"></div><div class="amt-num" aria-live="polite"><div class="expr num"></div><div class="val num"></div></div></div>
    ${extraRow()}
    <div class="fields">
      ${acctSel}
      <div class="datebox${form.type === 'transfer' ? ' wide' : ''}"><input class="field" type="date" id="f-date" value="${esc(form.date)}" aria-label="${t('日期')}"></div>
      <input class="field note wide" id="f-note" placeholder="${esc(t('備註，可加 #標籤（例如 #日本旅遊）'))}" value="${esc(form.note)}" maxlength="120" autocomplete="off">
    </div>
    ${tagChips()}
    <div class="pad" id="pad">
      ${['7', '8', '9', 'back', '4', '5', '6', '+', '1', '2', '3', '-', '.', '0', '00'].map(k => {
        const op = k === 'back' || k === '+' || k === '-';
        return `<button type="button" data-k="${k}" class="${op ? 'op' : ''}" aria-label="${k === 'back' ? t('刪除一位') : k === '-' ? t('減') : k === '+' ? t('加') : k}">${k === 'back' ? '⌫' : k === '-' ? '−' : k}</button>`;
      }).join('')}
      <button type="button" class="save" data-k="save">${t(form.editId ? '更新' : '儲存')}</button>
    </div>
  </section>`;
}
function refreshAdd() {
  const swap = (id, html) => { const el = document.getElementById(id); if (el) el.outerHTML = html; };
  swap('dyn-cats', catGrid()); swap('dyn-bud', budgetStrip()); swap('dyn-tags', tagChips());
  if (document.activeElement?.id !== 'f-rate' && document.activeElement?.id !== 'f-toamt') swap('dyn-extra', extraRow());
  const el = document.getElementById('dyn-today'); if (el) el.innerHTML = todayLine();
  const a = document.getElementById('f-acct'); if (a) a.innerHTML = acctOptions(form.acct);
  updateAmount();
}

function txRow(x) {
  let badge, title, sub, cls, sign;
  if (x.type === 'transfer') {
    badge = `<span class="badge" style="--c:var(--xfer)">${icon('transfer')}</span>`; title = typeName('transfer'); sub = esc(`${acctName(x.acct)} → ${acctName(x.to)}`); cls = 'xfer'; sign = '';
  } else {
    const c = findCat(x.type, x.cat); title = catName(x.type, x.cat);
    badge = `<span class="badge" style="--c:${catColor(c)}">${c ? glyph(c.id, title) : initial(title)}</span>`; sub = esc(acctName(x.acct));
    cls = x.type === 'expense' ? 'exp' : 'inc'; sign = x.type === 'expense' ? '-' : '+';
  }
  if (x.rid) sub += ' · ' + t('固定');
  if (x.note) sub += ' · ' + esc(x.note);
  if (x.tags?.length) sub += ' ' + x.tags.map(g => `<em>#${esc(g)}</em>`).join(' ');
  let amt = `${sign}${fmtC(x.amount, x.cur)}`;
  if (x.cur && x.cur !== meta.baseCur && x.type !== 'transfer') amt += `<small>≈ ${fmt(val(x))}</small>`;
  if (x.type === 'transfer' && x.toAmount != null) amt += `<small>→ ${fmtC(x.toAmount, acctCur(x.to))}</small>`;
  return `<li><button type="button" class="row" data-edit="${esc(x.id)}" data-ym="${esc(x.date.slice(0, 7))}">${badge}<span class="mid"><b>${esc(title)}</b><small>${sub}</small></span><span class="amt ${cls}">${amt}</span></button></li>`;
}
function groupByDay(list) {
  const g = new Map();
  for (const x of sortTx(list)) { if (!g.has(x.date)) g.set(x.date, []); g.get(x.date).push(x); }
  return [...g].map(([d, items]) => {
    const s = sums(items);
    return `<div class="day"><div class="day-head"><span>${esc(dayLabel(d))}${d.slice(0, 4) !== today().slice(0, 4) ? ' · ' + d.slice(0, 4) : ''}</span><span class="num">${s.inc ? t('收 {v}', { v: fmt(s.inc) }) + '　' : ''}${s.exp ? t('支 {v}', { v: fmt(s.exp) }) : ''}</span></div>
      <ul class="rows card">${items.map(txRow).join('')}</ul></div>`;
  }).join('');
}
function monthBar(ym, key) {
  return `<div class="monthbar"><button type="button" class="iconbtn" data-mon="${key}" data-d="-1" aria-label="${t('上個月')}">‹</button><strong>${esc(ymLabel(ym))}</strong><button type="button" class="iconbtn" data-mon="${key}" data-d="1" aria-label="${t('下個月')}">›</button></div>`;
}
function totalsCard(s) {
  return `<div class="totals"><div class="tile inc"><span><i></i>${t('收入')}</span><b>${fmt(s.inc)}</b></div><div class="tile exp"><span><i></i>${t('支出')}</span><b>${fmt(s.exp)}</b></div><div class="tile net"><span><i></i>${t('結餘')}</span><b>${fmt(s.net)}</b></div></div>`;
}
function viewList() {
  const ym = ui.listMonth ||= today().slice(0, 7);
  const q = ui.q.trim().toLowerCase();
  let body;
  if (q) {
    const words = q.split(/\s+/);
    const hits = allTx().filter(x => {
      const hay = [x.note, x.amount, x.date, acctName(x.acct), x.to ? acctName(x.to) : '', x.cat ? catName(x.type, x.cat) : '', findCat(x.type, x.cat)?.name || '', typeName(x.type), x.cur || '', ...(x.tags || []).map(g => '#' + g)].join(' ').toLowerCase();
      return words.every(w => hay.includes(w));
    });
    body = `<p class="hint" style="margin-top:10px">${t('在所有月份找到 {n} 筆', { n: hits.length })}</p>${totalsCard(sums(hits))}${groupByDay(hits) || `<div class="empty">${t('沒有符合的記錄')}</div>`}`;
  } else {
    const list = monthTx(ym);
    body = monthBar(ym, 'list') + summaryRing(sums(list)) + (groupByDay(list) || `<div class="empty">${icon('receipt')}${t('這個月還沒有記錄。<br>到「記一筆」輸入金額、選分類，按儲存即可。')}</div>`);
  }
  return `<input class="field search" id="f-q" type="search" placeholder="${esc(t('搜尋備註、分類、帳戶、金額或 #標籤'))}" value="${esc(ui.q)}" autocomplete="off">${body}`;
}

function donut(items, total) {
  const R = 54, C = 2 * Math.PI * R; let off = 0;
  const segs = items.map(it => { const len = (it.v / total) * C; const s = `<circle r="${R}" cx="80" cy="80" fill="none" stroke="${it.color}" stroke-width="22" stroke-dasharray="${Math.max(len - (items.length > 1 ? 1.5 : 0), 0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 160 160" role="img" aria-label="${t('分類占比圓餅圖')}">
    <circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--sunk)" stroke-width="22"/>${segs}
    <text x="80" y="76" text-anchor="middle" style="font-size:9px;fill:var(--muted);font-family:var(--font-ui)">${esc(t('{t}合計', { t: typeName(ui.statsType) }))}</text>
    <text x="80" y="94" text-anchor="middle" style="font-size:14px;fill:var(--fg);font-weight:600">${esc(fmt(total))}</text></svg>`;
}
function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const short = v => lang === 'en' ? (v >= 1000 ? round2(v / 1000) + 'k' : String(round2(v))) : v >= 10000 ? round2(v / 10000) + (lang === 'zh-CN' ? '万' : '萬') : String(round2(v));
function dailyChart(ym, type) {
  const n = daysIn(ym); const vals = Array(n).fill(0);
  for (const x of monthTx(ym)) if (x.type === type) vals[Number(x.date.slice(8)) - 1] += val(x);
  const max = niceMax(Math.max(...vals)); const W = 320, H = 140, L = 34, B = 18, T = 8;
  const bw = (W - L - 4) / n; const y = v => T + (H - T - B) * (1 - v / max);
  const color = type === 'expense' ? 'var(--exp)' : 'var(--inc)';
  const td = today(); const isCur = td.slice(0, 7) === ym;
  let g = [0, .5, 1].map(f => `<line class="grid" x1="${L}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${L - 4}" y="${y(max * f) + 3}" text-anchor="end">${short(max * f)}</text>`).join('');
  g += vals.map((v, i) => v > 0 ? `<rect x="${L + 2 + i * bw + bw * .15}" y="${y(v)}" width="${bw * .7}" height="${H - B - y(v)}" rx="1.5" fill="${color}"><title>${esc(t('{d}日 {v}', { d: i + 1, v: fmt(v) }))}</title></rect>` : '').join('');
  g += [1, 5, 10, 15, 20, 25, n].map(d => `<text x="${L + 2 + (d - .5) * bw}" y="${H - 4}" text-anchor="middle">${d}</text>`).join('');
  if (isCur) { const d = Number(td.slice(8)); g += `<line x1="${L + 2 + (d - .5) * bw}" x2="${L + 2 + (d - .5) * bw}" y1="${T}" y2="${H - B}" stroke="var(--accent)" stroke-dasharray="2 3"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('每日{t}', { t: typeName(type) }))}">${g}</svg>`;
}
// Category detail sheet (opened from the stats legend): totals, change vs last month, 6-month bars and this month's records.
function openCatSheet(type, catId, pr) {
  const ym = pr.ym;
  const c = findCat(type, catId); const name = catName(type, catId); const color = catColor(c);
  const of = m => monthTx(m).filter(x => x.type === type && x.cat === catId);
  const inRange = txIn(pr);
  const list = inRange.filter(x => x.type === type && x.cat === catId);
  const total = round2(list.reduce((a, x) => a + val(x), 0));
  const monthTotal = sums(inRange)[type === 'expense' ? 'exp' : 'inc'];
  const pct = monthTotal ? Math.round(total / monthTotal * 1000) / 10 : 0;
  const biggest = list.reduce((m, x) => !m || val(x) > val(m) ? x : m, null);
  const ms = Array.from({ length: 6 }, (_, i) => addMonth(ym, i - 5));
  const vals = ms.map(m => round2(of(m).reduce((a, x) => a + val(x), 0)));
  const diff = round2(total - vals[4]);
  const diffTxt = diff > 0 ? t('比上月多 {v}', { v: fmt(diff) }) : diff < 0 ? t('比上月少 {v}', { v: fmt(-diff) }) : t('與上月相同');
  const max = niceMax(Math.max(...vals)); const W = 300, H = 104, B = 18, T = 16, gw = W / 6;
  const y = v => T + (H - T - B) * (1 - v / max);
  const bars = vals.map((v, i) => {
    const x = i * gw, cur = i === 5;
    return `${v ? `<rect x="${x + gw * .26}" y="${y(v)}" width="${gw * .48}" height="${H - B - y(v)}" rx="3" fill="${color}" opacity="${cur ? 1 : .45}"><title>${esc(ymLabel(ms[i]))} ${fmt(v)}</title></rect>` : ''}
      ${cur && v ? `<text x="${x + gw / 2}" y="${y(v) - 4}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${short(v)}</text>` : ''}
      <text x="${x + gw / 2}" y="${H - 4}" text-anchor="middle"${cur ? ' style="fill:var(--fg);font-weight:600"' : ''}>${esc(monthShort(ms[i]))}</text>`;
  }).join('');
  const lim = type === 'expense' ? Number(meta.budgets.cats[catId]) || 0 : 0;
  const panel = document.getElementById('sheet-panel');
  panel.innerHTML = `<div class="sheet-grip"></div>
    <div class="sh-head"><span class="badge" style="--c:${color}">${c ? glyph(c.id, name) : initial(name)}</span>
      <span class="mid"><h3 id="sheet-title">${esc(name)}</h3><small>${esc(pr.label)} · ${esc(typeName(type))}</small></span>
      <button type="button" class="iconbtn" data-close="1" aria-label="${t('關閉')}">✕</button></div>
    <div class="sh-total num ${type === 'expense' ? 'exp' : 'inc'}">${fmt(total)}</div>
    <div class="sh-diff">${pr.isMonth ? `${esc(t('佔本月{t} {p}%', { t: typeName(type), p: pct }))} · ${esc(diffTxt)}` : esc(t('佔期間{t} {p}%', { t: typeName(type), p: pct }))}</div>
    <div class="sh-stats">
      <div><span>${t('筆數')}</span><b>${list.length}</b></div>
      <div><span>${t('平均每筆')}</span><b>${fmt(list.length ? total / list.length : 0)}</b></div>
      <div><span>${t('最大一筆')}</span><b>${biggest ? fmt(val(biggest)) : '—'}</b></div>
    </div>
    ${lim ? `<div class="card budlist" style="margin-top:10px">${budgetRow(t('{c}預算', { c: name }), total, lim)}</div>` : ''}
    <h2>${t('近 6 個月')}</h2><div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('近 6 個月'))}">${bars}</svg></div>
    <h2>${t(pr.isMonth ? '這個月的記錄' : '期間內的記錄')}</h2>${groupByDay(list) || `<div class="empty">${t('沒有符合的記錄')}</div>`}`;
  const sheet = document.getElementById('sheet');
  sheet.hidden = false;
  panel.scrollTop = 0;
  panel.querySelector('.iconbtn').focus();
}
function closeSheet() { const s = document.getElementById('sheet'); if (!s.hidden) { s.hidden = true; } }
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const r = e.target.closest('[data-edit]');
  if (r) { const x = months[r.dataset.ym]?.[r.dataset.edit]; closeSheet(); if (x) startEdit(x); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// Records page summary: the ring's track is the month's income, the red arc is how much of it was spent; net sits in the middle.
function summaryRing(s) {
  const R = 49, C = 2 * Math.PI * R;
  const ratio = s.inc > 0 ? s.exp / s.inc : (s.exp > 0 ? 1 : 0);
  const len = Math.min(ratio, 1) * C;
  const track = s.inc > 0 ? 'var(--ring-in)' : 'var(--sunk)';
  const net = fmt(s.net);
  return `<div class="sumring">
    <div class="ringbox">
      <svg viewBox="0 0 120 120" role="img" aria-label="${esc(t('收支比例'))}">
        <circle cx="60" cy="60" r="${R}" fill="none" style="stroke:${track}" stroke-width="20"/>
        ${len > 0 ? `<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:var(--ring-out)" stroke-width="20" stroke-linecap="${ratio >= 1 ? 'butt' : 'round'}" stroke-dasharray="${len} ${C}" transform="rotate(-90 60 60)"/>` : ''}
      </svg>
      <div class="rc"><button type="button" class="rc-link" data-act="to-stats" aria-label="${esc(t('結餘') + ' · ' + t('統計'))}">${t('結餘')}${icon('eye')}</button><b class="num ${s.net < 0 ? 'exp' : ''}" style="font-size:${net.length > 10 ? 17 : net.length > 8 ? 20 : 24}px">${net}</b></div>
    </div>
  </div>`;
}
function trendChart(endYm) {
  const ms = Array.from({ length: 12 }, (_, i) => addMonth(endYm, i - 11));
  const data = ms.map(m => sums(monthTx(m)));
  const max = niceMax(Math.max(...data.map(d => Math.max(d.inc, d.exp))));
  const W = 320, H = 150, L = 34, B = 18, T = 8; const gw = (W - L - 4) / 12; const y = v => T + (H - T - B) * (1 - v / max);
  let g = [0, .5, 1].map(f => `<line class="grid" x1="${L}" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${L - 4}" y="${y(max * f) + 3}" text-anchor="end">${short(max * f)}</text>`).join('');
  data.forEach((d, i) => {
    const x = L + 2 + i * gw; const bw = gw * .34;
    if (d.inc) g += `<rect x="${x + gw * .14}" y="${y(d.inc)}" width="${bw}" height="${H - B - y(d.inc)}" rx="1.5" fill="var(--inc)"><title>${esc(ymLabel(ms[i]))} ${t('收入')} ${fmt(d.inc)}</title></rect>`;
    if (d.exp) g += `<rect x="${x + gw * .52}" y="${y(d.exp)}" width="${bw}" height="${H - B - y(d.exp)}" rx="1.5" fill="var(--exp)"><title>${esc(ymLabel(ms[i]))} ${t('支出')} ${fmt(d.exp)}</title></rect>`;
    g += `<text x="${x + gw / 2}" y="${H - 4}" text-anchor="middle"${ms[i] === endYm ? ' style="fill:var(--fg);font-weight:600"' : ''}>${esc(monthShort(ms[i]))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('近 12 個月收支趨勢')}">${g}</svg>`;
}
function budgetRow(label, spent, lim) {
  const p = lim ? spent / lim : 0;
  return `<div class="bud"><div class="bud-top"><span>${esc(label)}</span><span class="num">${fmt(spent)} / ${fmt(lim)}</span></div>
    <div class="track"><i class="${p > 1 ? 'over' : p >= .8 ? 'warn' : ''}" style="width:${Math.min(p, 1) * 100}%"></i></div>
    <small class="${p > 1 ? 'exp' : ''}">${p > 1 ? t('超支 {v}', { v: fmt(spent - lim) }) : t('剩 {v}，已用 {p}%', { v: fmt(lim - spent), p: Math.round(p * 100) })}</small></div>`;
}
// Period for the category share chart: the stats month, the 6 or 12 months ending at it, or a custom date range.
const PIE_RANGES = { month: '本月', '6m': '半年', '1y': '一年', custom: '自訂' };
function pieRange() {
  const ym = ui.statsMonth || today().slice(0, 7);
  const end = `${ym}-${pad2(daysIn(ym))}`;
  if (ui.pieRange === '6m' || ui.pieRange === '1y') {
    const s = addMonth(ym, ui.pieRange === '6m' ? -5 : -11);
    return { from: s + '-01', to: end, label: t('{a} 至 {b}', { a: ymLabel(s), b: ymLabel(ym) }), isMonth: false, ym };
  }
  if (ui.pieRange === 'custom') {
    let f = ui.pieFrom || ym + '-01', e = ui.pieTo || today();
    if (f > e) [f, e] = [e, f];
    return { from: f, to: e, label: t('{a} 至 {b}', { a: f, b: e }), isMonth: false, ym };
  }
  return { from: ym + '-01', to: end, label: ymLabel(ym), isMonth: true, ym };
}
const txIn = r => allTx().filter(x => x.date >= r.from && x.date <= r.to);
function rangeBar(pr) {
  const seg = `<div class="seg rangeseg" role="group" aria-label="${t('期間')}">${Object.entries(PIE_RANGES).map(([k, v]) => `<button type="button" data-pr="${k}" aria-pressed="${(ui.pieRange || 'month') === k}">${t(v)}</button>`).join('')}</div>`;
  const custom = ui.pieRange === 'custom' ? `<div class="rangedates"><input class="field" type="date" id="p-from" value="${esc(pr.from)}" aria-label="${t('開始日期')}"><span>–</span><input class="field" type="date" id="p-to" value="${esc(pr.to)}" aria-label="${t('結束日期')}"></div>` : '';
  return `<div class="rangebar">${seg}${custom}${ui.pieRange && ui.pieRange !== 'month' && ui.pieRange !== 'custom' ? `<p class="hint" style="margin:0">${esc(pr.label)}</p>` : ''}</div>`;
}
function viewStats() {
  const ym = ui.statsMonth ||= today().slice(0, 7);

  const items = Object.entries(by).map(([id, v]) => { const c = findCat(type, id); return { id, v: round2(v), name: catName(type, id), color: catColor(c) }; }).sort((a, b) => b.v - a.v);

  const b = meta.budgets; const expList = list.filter(x => x.type === 'expense');

     <h2>${t('近 12 個月趨勢')}</h2><div class="card"><div class="chart">${trendChart(ym)}</div><div class="chart-key"><span><i style="background:var(--inc)"></i>${t('收入')}</span><span><i style="background:var(--exp)"></i>${t('支出')}</span></div></div>

}

        <button type="button" class="btn" data-act="export-csv">${t('匯出明細 (CSV / Excel)')}</button>
      </div>
      ${ui.exportText ? `<div class="notice">${t('這裡無法直接下載檔案，請複製下面內容另存成 <b>{n}</b>。', { n: esc(ui.exportText.name) })}</div><textarea class="field" id="exp-text" readonly>${esc(ui.exportText.text)}</textarea><div class="btnrow"><button type="button" class="btn" data-act="copy-export">${t('複製')}</button><button type="button" class="btn" data-act="close-export">${t('關閉')}</button></div>` : ''}
      <div style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px">
        <p>${t('從備份還原：選擇之前匯出的 JSON 檔，記錄會合併進來，不會刪掉現有資料。')}</p>
        <input type="file" id="f-import" accept=".json,application/json">
        ${ui.importData ? `<div class="notice">${t('檔案內有 {n} 筆記錄、{a} 個帳戶。', { n: ui.importData.transactions.length, a: ui.importData.meta?.accounts?.length || 0 })}</div><div class="btnrow"><button type="button" class="btn primary" data-act="import-go">${t('合併匯入')}</button><button type="button" class="btn" data-act="import-cancel">${t('取消')}</button></div>` : ''}
      </div>
    </div>
    <p class="hint">${t('共 {n} 筆記錄 · {a} 個帳戶 · {r} 個週期帳目', { n: allTx().length, a: meta.accounts.length, r: meta.recurring.length })}</p>`;
  return settingsShell(S, stale, lb, foreign);
}
const SET_SECS = [['lang', '語言'], ['theme', '外觀'], ['budget', '預算'], ['rec', '週期性帳目'], ['cats', '分類'], ['cur', '幣別與匯率'], ['backup', '備份與同步']];
function settingsShell(S, stale, lb, foreign) {
  S.theme = `<div class="card"><div class="langs" role="group" aria-label="${t('外觀')}">${Object.entries(THEMES).map(([k, v]) => `<button type="button" data-theme-opt="${k}" aria-pressed="${themePref === k}">${t(v)}</button>`).join('')}</div></div>
    <p class="hint">${t('只套用在這台裝置。')}</p>`;
  const sec = ui.setSec;
  if (sec && S[sec]) {
    const title = SET_SECS.find(s => s[0] === sec)[1];
    return `<div class="subhead"><button type="button" class="iconbtn" data-act="set-back" aria-label="${t('返回')}">‹</button><span class="mi" style="--c:${SEC_COLORS[sec]}">${icon('s_' + sec)}</span><strong>${t(title)}</strong></div>${S[sec]}`;
  }
  const nCatBud = Object.values(meta.budgets.cats).filter(v => Number(v) > 0).length;
  const bud = [meta.budgets.total ? t('每月 {v}', { v: fmt(meta.budgets.total) }) : '', nCatBud ? t('{n} 個分類上限', { n: nCatBud }) : ''].filter(Boolean).join(' · ');
  const sum = {
    lang: LANGS[lang],
    theme: t(THEMES[themePref]),
    budget: bud || t('未設定'),
    rec: meta.recurring.length ? t('{n} 項', { n: meta.recurring.length }) : t('未設定'),
    cats: t('支出 {a} · 收入 {b}', { a: meta.cats.expense.length, b: meta.cats.income.length }),
    cur: [meta.baseCur, ...foreign].join(' · '),
    backup: lb ? t('上次匯出備份：{d}', { d: lb.toLocaleDateString(loc()) }) : t('還沒有匯出過備份'),
  };
  const warn = mode === 'local' ? `<div class="notice warn" style="margin-top:6px">${t('目前無法連上雲端，資料只存在這台裝置的瀏覽器。清除瀏覽資料就會消失，請常匯出備份。')}</div>` : '';
  return `${warn}<nav class="menu card" style="margin-top:6px" aria-label="${t('設定')}">${SET_SECS.map(([k, title]) =>
    `<button type="button" data-sec="${k}"><span class="mi" style="--c:${SEC_COLORS[k]}">${icon('s_' + k)}</span><span class="mid"><b>${t(title)}</b><small class="${k === 'backup' && stale ? 'exp' : ''}">${esc(sum[k])}</small></span><span class="chev" aria-hidden="true">›</span></button>`).join('')}</nav>`;
}

const VIEWS = { add: viewAdd, list: viewList, stats: viewStats, accounts: viewAccounts, settings: viewSettings };
function render(force) {
  const main = document.getElementById('main');
  const ae = document.activeElement;
  if (!force && view !== 'add' && ae && main.contains(ae) && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && ae.type !== 'file') { needRender = true; return; }
  if (!force && view === 'add' && main.dataset.v === 'add') { refreshAdd(); setSync(); return; }
  needRender = false;
  const st = main.scrollTop;
  const keep = main.dataset.v === view;
  main.dataset.v = view;
  main.innerHTML = VIEWS[view]();
  if (keep) main.scrollTop = st;
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-current', b.dataset.v === view ? 'page' : 'false');
  if (view === 'add') updateAmount();
  setSync();
}
function go(v) { const same = v === view; view = v; ui.confirm = null; if (v === 'settings') ui.setSec = null; if (v !== 'add' && form.editId) resetForm(); document.getElementById('main').dataset.v = ''; render(true); if (!same) document.getElementById('main').scrollTop = 0; }

// ---------- export / import ----------
async function offerFile(name, text) {
  if (downloads) {
    try { await downloads.save({ filename: name, data: text }); return true; }
    catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast(t('請先處理已開啟的下載視窗')); return false; } }
  }
  ui.exportText = { name, text }; render(true); return true;
}
async function exportJson() {
  const data = { app: '隨手記帳', format: 2, exportedAt: new Date().toISOString(), meta, transactions: sortTx(allTx()).reverse() };
  const ok = await offerFile(`${t('記帳備份')}-${today()}.json`, JSON.stringify(data, null, 1));
  if (ok) { meta.lastBackup = Date.now(); persist('meta'); if (!ui.exportText) { toast(t('備份已匯出')); render(true); } }
}
async function exportCsv() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [[t('日期'), t('類型'), t('金額'), t('幣別'), t('匯率'), t('換算{b}', { b: meta.baseCur }), t('分類'), t('帳戶'), t('轉入帳戶'), t('轉入金額'), t('備註'), t('標籤')].map(q).join(',')];
  for (const x of sortTx(allTx()).reverse()) lines.push([x.date, typeName(x.type), x.amount, x.cur || meta.baseCur, x.rate || 1, val(x), x.cat ? catName(x.type, x.cat) : '', acctName(x.acct), x.to ? acctName(x.to) : '', x.toAmount ?? '', x.note, (x.tags || []).join(' ')].map(q).join(','));
  const ok = await offerFile(`${t('記帳明細')}-${today()}.csv`, '﻿' + lines.join('\r\n'));
  if (ok && !ui.exportText) toast(t('明細已匯出'));
}
function readImport(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.transactions)) throw 0;
      d.transactions = d.transactions.filter(x => x && x.id && x.date && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && ['expense', 'income', 'transfer'].includes(x.type) && Number(x.amount) > 0);
      ui.importData = d; render(true);
    } catch { toast(t('這不是隨手記帳的備份檔')); }
  };
  r.readAsText(file);
}
function doImport() {
  const d = ui.importData; if (!d || !ready) return;
  if (d.meta) {
    const ids = new Set(meta.accounts.map(a => a.id));
    for (const a of d.meta.accounts || []) if (!ids.has(a.id)) meta.accounts.push({ cur: meta.baseCur, ...a });
    for (const k of ['expense', 'income']) { const cids = new Set(meta.cats[k].map(c => c.id)); for (const c of d.meta.cats?.[k] || []) if (!cids.has(c.id)) meta.cats[k].push(c); }
    const rids = new Set(meta.recurring.map(r => r.id)); for (const r of d.meta.recurring || []) if (!rids.has(r.id)) meta.recurring.push(r);
    for (const [k, v] of Object.entries(d.meta.rates || {})) if (!meta.rates[k]) meta.rates[k] = v;
    if (!meta.budgets.total && d.meta.budgets?.total) meta.budgets.total = d.meta.budgets.total;
    for (const [k, v] of Object.entries(d.meta.budgets?.cats || {})) if (!meta.budgets.cats[k]) meta.budgets.cats[k] = v;
    persist('meta');
  }
  const touched = new Set();
  for (const x of d.transactions) { const ym = x.date.slice(0, 7); (months[ym] ||= {})[x.id] = { ...x, amount: round2(Number(x.amount)) }; touched.add(ym); }
  for (const ym of touched) persist(ym);
  ui.importData = null; render(true); toast(t('已匯入 {n} 筆記錄', { n: d.transactions.length }));
}

// ---------- events ----------
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) go(b.dataset.v); });
document.getElementById('themebtn').addEventListener('click', () => { setTheme(isDark() ? 'light' : 'dark'); if (view === 'settings') render(true); });
document.getElementById('sync').addEventListener('click', () => { if (failed.size && mode === 'cloud') retryFailed(); });
const main = document.getElementById('main');
main.addEventListener('focusout', () => setTimeout(() => { if (needRender) render(); }, 0));

main.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset;
  if (ds.k) { if (ds.k === 'save') saveTx(); else press(ds.k); return; }
  if (ds.lang) { setLang(ds.lang); return; }
  if (ds.themeOpt) { setTheme(ds.themeOpt); render(true); return; }
  if (ds.sec) { ui.setSec = ds.sec; ui.confirm = null; render(true); main.scrollTop = 0; return; }
  if (ds.t && b.closest('.entry')) { if (form.editId) return; resetForm(ds.t); render(true); return; }
  if (ds.cat) { form.cat = ds.cat; for (const x of main.querySelectorAll('.cat')) x.setAttribute('aria-pressed', x.dataset.cat === ds.cat); const s = document.getElementById('dyn-bud'); if (s) s.outerHTML = budgetStrip(); updateAmount(); return; }
  if (ds.tag) {
    const tags = parseTags(form.note);
    form.note = tags.includes(ds.tag) ? form.note.replace(new RegExp('\\s*#' + ds.tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|$)', 'g'), '').trim() : (form.note.trim() + ' #' + ds.tag).trim();
    document.getElementById('f-note').value = form.note; b.setAttribute('aria-pressed', !tags.includes(ds.tag)); return;
  }
  if (ds.edit) { const x = months[ds.ym]?.[ds.edit]; if (x) startEdit(x); return; }
  if (ds.mon) { const k = ds.mon + 'Month'; ui[k] = addMonth(ui[k], Number(ds.d)); render(true); return; }
  if (ds.st) { ui.statsType = ds.st; render(true); return; }
  if (ds.catsheet) { openCatSheet(ui.statsType, ds.catsheet, pieRange()); return; }
  if (ds.pr) {
    ui.pieRange = ds.pr;
    if (ds.pr === 'custom' && !ui.pieFrom) { const ym = ui.statsMonth || today().slice(0, 7); ui.pieFrom = ym + '-01'; ui.pieTo = today() < ym + '-01' ? ym + '-' + pad2(daysIn(ym)) : today(); }
    render(true); return;
  }
  if (ds.tagq) { ui.q = '#' + ds.tagq; go('list'); return; }
  if (ds.ct) { ui.catType = ds.ct; ui.confirm = null; render(true); return; }
  if (ds.rt) { ui.recType = ds.rt; render(true); return; }
  if (ds.acctOpen) { ui.openAcct = ui.openAcct === ds.acctOpen ? null : ds.acctOpen; ui.confirm = null; render(true); return; }
  if (ds.acctSave) {
    const a = findAcct(ds.acctSave); const name = document.getElementById('a-name').value.trim();
    if (!name) { toast(t('帳戶名稱不能空白')); return; }
    if (name !== nameOf(a)) a.name = name;
    a.type = document.getElementById('a-type').value; a.init = round2(Number(document.getElementById('a-init').value) || 0);
    const cs = document.getElementById('a-cur'); if (!cs.disabled) a.cur = cs.value;
    ui.openAcct = null; persist('meta'); render(true); toast(t('帳戶已更新')); return;
  }
  if (ds.acctMove) { move(meta.accounts, ds.acctMove, Number(ds.d)); persist('meta'); render(true); return; }
  if (ds.acctList) { ui.q = acctName(ds.acctList); go('list'); return; }
  if (ds.acctDel) {
    if (ui.confirm !== 'acct:' + ds.acctDel) { ui.confirm = 'acct:' + ds.acctDel; render(true); return; }
    meta.accounts = meta.accounts.filter(a => a.id !== ds.acctDel); ui.confirm = null; ui.openAcct = null; persist('meta'); render(true); toast(t('帳戶已刪除')); return;
  }
  if (ds.catColor) { const c = findCat(ui.catType, ds.catColor); c.c = (c.c + 1) % PALETTE.length; persist('meta'); render(true); return; }
  if (ds.catMove) { move(meta.cats[ui.catType], ds.catMove, Number(ds.d)); persist('meta'); render(true); return; }
  if (ds.catDel) {
    if (ui.confirm !== 'cat:' + ds.catDel) { ui.confirm = 'cat:' + ds.catDel; render(true); return; }
    if (meta.cats[ui.catType].length <= 1) { toast(t('至少要保留一個分類')); return; }
    meta.cats[ui.catType] = meta.cats[ui.catType].filter(c => c.id !== ds.catDel); ui.confirm = null; persist('meta'); render(true); toast(t('分類已刪除')); return;
  }
  if (ds.recToggle) {
    const r = meta.recurring.find(x => x.id === ds.recToggle); r.active = !r.active;
    if (r.active) { while (r.next < today()) r.next = advance(r, r.next); }   // resuming does not back-fill the paused period
    persist('meta'); render(true); toast(r.active ? t('已恢復，下次 {d}', { d: r.next }) : t('已暫停')); return;
  }
  if (ds.recDel) {
    if (ui.confirm !== 'rec:' + ds.recDel) { ui.confirm = 'rec:' + ds.recDel; render(true); return; }
    meta.recurring = meta.recurring.filter(x => x.id !== ds.recDel); ui.confirm = null; persist('meta'); render(true); toast(t('已刪除週期帳目，過去記入的記錄保留')); return;
  }
  switch (ds.act) {
    case 'del': if (!form.delArm) { form.delArm = true; b.textContent = t('確定刪除'); } else deleteEditing(); break;
    case 'cancel-edit': resetForm(); go('list'); break;
    case 'make-rec': makeRecurringFromForm(); break;
    case 'edit-cats': { const ct = form.type === 'income' ? 'income' : 'expense'; go('settings'); ui.catType = ct; ui.setSec = 'cats'; render(true); break; }
    case 'to-stats': ui.statsMonth = ui.listMonth; go('stats'); break;
    case 'set-back': ui.setSec = null; ui.confirm = null; render(true); main.scrollTop = 0; break;
    case 'acct-add': {
      const name = document.getElementById('a-new').value.trim(); if (!name) { toast(t('輸入帳戶名稱')); return; }
      const cur = document.getElementById('a-new-cur').value;
      meta.accounts.push({ id: 'a' + newId(), name, type: document.getElementById('a-new-type').value, init: 0, cur }); persist('meta'); render(true);
      toast(cur !== meta.baseCur && !rateOf(cur) ? t('已新增「{n}」，記得到設定填 {c} 匯率', { n: name, c: cur }) : t('已新增帳戶「{n}」', { n: name })); break;
    }
    case 'cat-add': {
      const name = document.getElementById('c-new').value.trim(); if (!name) { toast(t('輸入分類名稱')); return; }
      meta.cats[ui.catType].push({ id: 'c' + newId(), name, c: meta.cats[ui.catType].length % PALETTE.length }); persist('meta'); render(true); toast(t('已新增分類「{n}」', { n: name })); break;
    }
    case 'rec-add': {
      const amt = round2(Number(document.getElementById('r-amt').value));
      if (!(amt > 0)) { toast(t('輸入金額')); document.getElementById('r-amt').focus(); return; }
      const start = document.getElementById('r-start').value || today();
      const noteRaw = document.getElementById('r-note').value;
      const r = { id: newId(), type: ui.recType, amount: amt, acct: document.getElementById('r-acct').value, freq: document.getElementById('r-freq').value, start, next: start, active: true, note: stripTags(noteRaw), tags: parseTags(noteRaw) };
      if (r.type === 'transfer') {
        r.to = document.getElementById('r-to').value;
        if (r.to === r.acct) { toast(t('轉出和轉入要選不同帳戶')); return; }
        if (acctCur(r.to) !== acctCur(r.acct)) { const rf = rateOf(acctCur(r.acct)), rt2 = rateOf(acctCur(r.to)); if (!rf || !rt2) { toast(t('跨幣別轉帳請先填好兩邊的匯率')); return; } r.toAmount = round2(amt * rf / rt2); }
      } else r.cat = document.getElementById('r-cat').value;
      if (acctCur(r.acct) !== meta.baseCur && !rateOf(acctCur(r.acct))) { toast(t('請先在下方填 {c} 匯率', { c: acctCur(r.acct) })); return; }
      meta.recurring.push(r); persist('meta'); render(true); runRecurring();
      toast(t('已新增：{f}，{x}', { f: freqText(r), x: r.next > today() ? t('下次 {d}', { d: r.next }) : t('已補記到期的帳目') })); break;
    }
    case 'export-json': exportJson(); break;
    case 'export-csv': exportCsv(); break;
    case 'copy-export': {
      const ta = document.getElementById('exp-text');
      const fallback = () => { ta.focus(); ta.select(); toast(t('已全選，請按複製')); };
      try { navigator.clipboard.writeText(ui.exportText.text).then(() => toast(t('已複製')), fallback); } catch { fallback(); }
      break;
    }
    case 'close-export': ui.exportText = null; render(true); break;
    case 'import-go': doImport(); break;
    case 'import-cancel': ui.importData = null; render(true); break;
  }
});
function move(arr, id, d) { const i = arr.findIndex(x => x.id === id); const j = i + d; if (i < 0 || j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

main.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'f-note') {
    form.note = el.value; const tags = parseTags(form.note);
    for (const c of main.querySelectorAll('.chip[data-tag]')) c.setAttribute('aria-pressed', tags.includes(c.dataset.tag));
  }
  else if (el.id === 'f-rate') { form.rate = el.value; updateAmount(); }
  else if (el.id === 'f-toamt') { form.toAmt = el.value; }
  else if (el.id === 'f-q') { ui.q = el.value; const pos = el.selectionStart; render(true); const n = document.getElementById('f-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
});
main.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-acct') { form.acct = el.value; form.rate = ''; refreshAdd(); }
  else if (el.id === 'f-date') form.date = el.value || today();
  else if (el.id === 'p-from' || el.id === 'p-to') { if (el.value) { ui[el.id === 'p-from' ? 'pieFrom' : 'pieTo'] = el.value; render(true); } }
  else if (el.id === 'f-from') { form.acct = el.value; form.rate = ''; form.toAmt = ''; if (form.to === form.acct) form.to = meta.accounts.find(a => a.id !== form.acct)?.id; refreshAdd(); }
  else if (el.id === 'f-to') { form.to = el.value; form.toAmt = ''; refreshAdd(); }
  else if (el.dataset.catName) {
    const c = findCat(ui.catType, el.dataset.catName); const v = el.value.trim();
    if (c && v && v !== nameOf(c)) { c.name = v; persist('meta'); needRender = true; } else el.value = c ? nameOf(c) : '';
  }
  else if (el.dataset.bud) {
    const v = Math.max(0, round2(Number(el.value) || 0));
    if (el.dataset.bud === '__total') meta.budgets.total = v;
    else if (v) meta.budgets.cats[el.dataset.bud] = v; else delete meta.budgets.cats[el.dataset.bud];
    persist('meta'); needRender = true;
  }
  else if (el.dataset.rate) {
    const v = Number(el.value); if (v > 0) meta.rates[el.dataset.rate] = v; else delete meta.rates[el.dataset.rate];
    persist('meta'); needRender = true;
  }
  else if (el.id === 's-base') {
    if (allTx().length) return;
    meta.baseCur = el.value;
    for (const a of meta.accounts) a.cur = el.value;
    persist('meta'); needRender = true;
  }
  else if (el.id === 'f-import' && el.files[0]) readImport(el.files[0]);
});
main.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f-note') { e.preventDefault(); saveTx(); }
  if (e.key === 'Enter' && e.target.id === 'a-new') { e.preventDefault(); main.querySelector('[data-act="acct-add"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'c-new') { e.preventDefault(); main.querySelector('[data-act="cat-add"]').click(); }
  if (e.key === 'Enter' && e.target.matches('[data-bud],[data-rate]')) { e.preventDefault(); e.target.blur(); }
});
document.addEventListener('keydown', e => {
  if (view !== 'add' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const k = e.key;
  if (/^[0-9.+-]$/.test(k)) { e.preventDefault(); press(k); }
  else if (k === 'Backspace') { e.preventDefault(); press('back'); }
  else if (k === 'Enter') { e.preventDefault(); saveTx(); }
});
// Catch up recurring entries when the page is left open past midnight.
document.addEventListener('visibilitychange', () => { if (!document.hidden && ready) runRecurring(); });

renderChrome();
resetForm('expense');
boot();
})();
